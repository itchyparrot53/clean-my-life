name: Release

# Cut a release by pushing a tag:
#   Stable:  git tag v0.1.1        && git push origin v0.1.1
#   Beta:    git tag v0.1.1-beta.1 && git push origin v0.1.1-beta.1
#
# A tag with a hyphen is published as a GitHub pre-release. A stable tag must
# match the VERSION file. Signing is optional: when the Developer ID secrets
# are absent the DMG is ad-hoc signed and the release notes say so.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and publish DMG
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve version and channel
        id: version
        run: |
          FILE_VERSION=$(tr -d '[:space:]' < VERSION)
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
            VERSION="${TAG#v}"
          else
            VERSION="$FILE_VERSION"
            TAG="v$VERSION"
          fi
          if [[ "$VERSION" == *-* ]]; then
            PRERELEASE=true
          else
            PRERELEASE=false
            if [ "$VERSION" != "$FILE_VERSION" ]; then
              echo "::error::Stable tag $TAG does not match VERSION ($FILE_VERSION). Bump VERSION or use a -beta tag."
              exit 1
            fi
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION (tag $TAG, prerelease=$PRERELEASE)"

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Verify version sync and update configuration
        run: |
          bash scripts/check-version-sync.sh
          python3 scripts/test-update-configuration.py
          bash -n scripts/build-dmg.sh scripts/generate-update-feed.sh

      - name: Cache SwiftPM build
        uses: actions/cache@v5
        with:
          path: .build
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Build and test
        run: |
          swift build
          swift test
          python3 scripts/test-update-feed.py
          python3 scripts/test-publish-update-feed.py
          python3 scripts/test-network-surface.py

      - name: Detect signing secrets
        id: signing
        env:
          DEVID_CERT_P12_BASE64: ${{ secrets.DEVID_CERT_P12_BASE64 }}
        run: |
          if [ -n "$DEVID_CERT_P12_BASE64" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "No Developer ID certificate; building an ad-hoc signed beta DMG."
          fi

      - name: Import Developer ID certificate
        if: steps.signing.outputs.configured == 'true'
        env:
          DEVID_CERT_P12_BASE64: ${{ secrets.DEVID_CERT_P12_BASE64 }}
          DEVID_CERT_PASSWORD: ${{ secrets.DEVID_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERT_PATH="$RUNNER_TEMP/devid.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          echo -n "$DEVID_CERT_P12_BASE64" | base64 --decode -o "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/"//g')
          security import "$CERT_PATH" -P "$DEVID_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null
          rm -f "$CERT_PATH"

      - name: Store notarytool credentials
        if: steps.signing.outputs.configured == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          KEY_PATH="$RUNNER_TEMP/asc_key.p8"
          echo -n "$ASC_KEY_P8_BASE64" | base64 --decode -o "$KEY_PATH"
          xcrun notarytool store-credentials "CleanMyLife" \
            --key "$KEY_PATH" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID" \
            --keychain "$RUNNER_TEMP/app-signing.keychain-db"
          rm -f "$KEY_PATH"

      - name: Install YARA-X helper
        run: brew install yara-x

      - name: Build DMG
        env:
          APPLE_DEVELOPER_ID: ${{ secrets.APPLE_DEVELOPER_ID }}
          NOTARY_PROFILE: CleanMyLife
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          if [ "${{ steps.signing.outputs.configured }}" = "true" ]; then
            bash scripts/build-dmg.sh --notarize
          else
            bash scripts/build-dmg.sh
          fi
          ls -lh .build/CleanMyLife-*.dmg

      - name: Clean up keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" 2>/dev/null || true

      - name: Delete existing release (same tag)
        run: gh release delete "${{ steps.version.outputs.tag }}" --yes || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create release
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="${{ steps.version.outputs.tag }}"
          DMG=".build/CleanMyLife-${VERSION}.dmg"
          test -f "$DMG" || { echo "::error::DMG not found at $DMG"; exit 1; }

          if [ "${{ steps.version.outputs.prerelease }}" = "true" ]; then
            gh release create "$TAG" "$DMG" \
              --title "Clean My Life $TAG (beta)" \
              --prerelease \
              --notes "$(cat <<EOF
          ## Clean My Life $TAG (beta)

          The first public beta of the Clean My Life fork. Back up anything important and pin this tag.

          ### Install
          Download **CleanMyLife-${VERSION}.dmg**, open it, and drag **Clean My Life** to Applications.

          This beta is ad-hoc signed, not notarized. If macOS blocks the first launch, run:

          \`\`\`bash
          xattr -dr com.apple.quarantine "/Applications/Clean My Life.app"
          \`\`\`

          Building from source avoids the warning: see the README.

          ### Requirements
          - macOS 14 Sonoma or later
          - Full Disk Access for Mail, Privacy and parts of the malware scan
          - YARA-X is optional: \`brew install yara-x\` enables the pattern-rule pass

          ### Safety
          Trash-first deletion, a protected-path guard, and every flagged item carries a reason. Only Apple XProtect signatures are pre-selected.
          EOF
          )"
          else
            gh release create "$TAG" "$DMG" \
              --title "Clean My Life $TAG" \
              --generate-notes \
              --notes "$(cat <<EOF
          ## Clean My Life $TAG

          Download **CleanMyLife-${VERSION}.dmg** below, open it, and drag **Clean My Life** to Applications.

          ### Requirements
          - macOS 14 Sonoma or later
          - Full Disk Access for complete scan results
          - YARA-X is optional: \`brew install yara-x\`

          ### Safety
          Trash-first deletion, a protected-path guard, and every flagged item carries a reason.
          EOF
          )"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
