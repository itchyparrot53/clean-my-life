name: Diagnose build
on:
  push:
  workflow_dispatch:

permissions:
  contents: write
  checks: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - name: Build and capture
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          set +e
          swift build > /tmp/build.log 2>&1
          code=$?
          CODE=$code python3 - <<'PY'
          import json, os, urllib.request
          text = open('/tmp/build.log', 'rb').read().decode('utf-8', 'replace')[-50000:]
          conclusion = 'success' if os.environ['CODE'] == '0' else 'failure'
          payload = {
              'name': 'swift build log',
              'head_sha': os.environ['SHA'],
              'status': 'completed',
              'conclusion': conclusion,
              'output': {'title': 'swift build', 'summary': '```\n' + text + '\n```'},
          }
          request = urllib.request.Request(
              'https://api.github.com/repos/' + os.environ['REPO'] + '/check-runs',
              data=json.dumps(payload).encode(),
              headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                       'Accept': 'application/vnd.github+json',
                       'Content-Type': 'application/json'})
          try:
              urllib.request.urlopen(request)
          except Exception as error:
              print('check-run failed:', error)
          PY
          cp /tmp/build.log BUILD_LOG.txt
          git config user.name "clean-my-life ci"
          git config user.email "ci@users.noreply.github.com"
          git checkout -b diagnostics
          git add BUILD_LOG.txt
          git commit -m "CI build log" || true
          git push -f origin HEAD:diagnostics || true
          exit $code
