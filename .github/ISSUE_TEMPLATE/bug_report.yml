name: Bug report
description: Something is broken or behaves unexpectedly.
title: 'bug: '
labels: [bug, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please remove secrets, private file paths and personal data from logs and screenshots.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Click ...
        3. See ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Clean My Life version
      description: Settings > About, or the DMG filename.
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac model
      placeholder: macOS 15.2, MacBook Pro (M3)
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How did you install it?
      options:
        - DMG from Releases
        - Built from source
        - Homebrew cask from the repo
        - Other
    validations:
      required: true
  - type: dropdown
    id: module
    attributes:
      label: Which area?
      options:
        - Malware Removal
        - System Junk / Cleanup
        - Downloads / AI Clutter / Photos tools
        - Uninstaller / Unused Apps / Updater
        - Space Lens / Duplicates / Large & Old Files
        - Maintenance / Optimization
        - Menu bar or onboarding
        - Build, tests or packaging
        - Other
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Redact secrets and personal data. Malware scan output is welcome.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and discussions.
          required: true
        - label: I removed secrets and personal data from this report.
          required: true
        - label: This is not a security vulnerability. (Use SECURITY.md instead.)
          required: true
